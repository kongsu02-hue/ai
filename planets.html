<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태양계 탐험 | 행성 소개</title>
  <meta name="description" content="수성부터 해왕성까지 여덟 행성 소개">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="index.html">☀ 태양계 <span>탐험</span></a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="planets.html" class="active">행성 소개</a></li>
        <li><a href="compare.html">행성 비교</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1 class="section-title fade-up">여덟 행성 소개</h1>
      <p class="section-sub fade-up d1">태양에서 가까운 순서대로 정리했습니다. 카드를 누르면 자세한 정보가 열립니다.</p>

      <div class="filters fade-up d2" role="group" aria-label="행성 종류 필터">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="rocky">암석형</button>
        <button class="filter-btn" data-filter="gas">가스형</button>
        <button class="filter-btn" data-filter="ice">얼음형</button>
      </div>

      <div class="planet-grid" id="planetGrid"></div>
    </section>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="닫기">×</button>
      <div class="modal-img" id="modalImg"></div>
      <div>
        <span class="chip" id="modalType"></span>
        <h2 id="modalTitle"></h2>
        <p class="desc" id="modalDesc"></p>
        <dl class="facts" id="modalFacts"></dl>
        <p class="fun-fact" id="modalFact"></p>
        <div class="modal-nav">
          <button class="btn ghost" id="prevBtn">← 이전 행성</button>
          <button class="btn ghost" id="nextBtn">다음 행성 →</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>태양계 탐험 · 정보 제공용 사이트</p>
    <p>이미지 출처: NASA / JPL / ESA (Wikimedia Commons, 퍼블릭 도메인)</p>
  </footer>

  <script src="js/planets.js"></script>
  <script src="js/main.js"></script>
  <script>
    const grid = document.getElementById("planetGrid");
    const modal = document.getElementById("modal");
    let current = 0;
    let lastFocus = null;

    // 카드 만들기
    grid.innerHTML = PLANETS.map((p, i) => `
      <button class="planet-card reveal" data-type="${p.type}" data-index="${i}" style="--glow:${p.color}; transition-delay:${i * 60}ms">
        <div class="thumb${p.id === "saturn" ? " wide" : ""}"><img src="${p.img}" alt="${p.name} 사진" loading="lazy"></div>
        <h3>${p.name}<small>${p.en}</small></h3>
        <p>${p.summary}</p>
        <span class="chip tag">${p.typeLabel}</span>
      </button>`).join("");
    observeReveal(grid);

    // 필터
    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const f = btn.dataset.filter;
        grid.querySelectorAll(".planet-card").forEach((card) => {
          card.classList.toggle("hide", f !== "all" && card.dataset.type !== f);
        });
      });
    });

    // 모달
    function openModal(i) {
      current = (i + PLANETS.length) % PLANETS.length;
      const p = PLANETS[current];
      const img = document.getElementById("modalImg");
      img.className = "modal-img" + (p.id === "saturn" ? " wide" : "");
      img.innerHTML = `<img src="${p.img}" alt="${p.name} 사진">`;
      document.getElementById("modalType").textContent = p.typeLabel + " 행성";
      document.getElementById("modalTitle").innerHTML = `${p.name}<small>${p.en}</small>`;
      document.getElementById("modalDesc").textContent = p.desc;
      document.getElementById("modalFacts").innerHTML = [
        ["지름", p.diameter.toLocaleString() + " km"],
        ["태양과의 거리", p.distance],
        ["공전 주기 (1년)", p.year],
        ["자전 주기 (하루)", p.day],
        ["위성 수", p.moons],
        ["중력 (지구=1)", p.gravity],
        ["표면 온도", p.temp]
      ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
      document.getElementById("modalFact").textContent = "💡 " + p.fact;
      // 애니메이션 다시 재생
      const box = modal.querySelector(".modal-box");
      box.style.animation = "none"; box.offsetHeight; box.style.animation = "";
      if (!modal.classList.contains("open")) {
        lastFocus = document.activeElement;
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        modal.querySelector(".modal-close").focus();
      }
    }
    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (lastFocus) lastFocus.focus();
    }
    grid.addEventListener("click", (e) => {
      const card = e.target.closest(".planet-card");
      if (card) openModal(Number(card.dataset.index));
    });
    modal.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closeModal));
    document.getElementById("prevBtn").addEventListener("click", () => openModal(current - 1));
    document.getElementById("nextBtn").addEventListener("click", () => openModal(current + 1));
    document.addEventListener("keydown", (e) => {
      if (!modal.classList.contains("open")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") openModal(current - 1);
      if (e.key === "ArrowRight") openModal(current + 1);
    });
  </script>
</body>
</html>
